<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Dashboard | Aris & Ghefira</title>

    <meta property="og:title" content="Wedding Dashboard Aris & Ghefira">
    <meta property="og:description" content="Guest Management System for Aris & Ghefira">
    <meta property="og:image" content="logo.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <script src="config.js"></script>
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #faf6f0; overflow-x: hidden; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .card-shadow { box-shadow: 0 10px 25px -5px rgba(199, 147, 105, 0.12), 0 8px 10px -6px rgba(199, 147, 105, 0.1); }
        .bg-stone-green { background-color: #c79369; }
        .text-stone-green { color: #c79369; }

        #fullOverlay {
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateX(100%);
            will-change: transform;
        }
        #fullOverlay.active { transform: translateX(0); }

        .iframe-loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: -1;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(199, 147, 105, 0.15);
            border-top-color: #c79369;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen">

    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <header class="flex justify-between items-center mb-10">
            <div>
                <p class="text-[10px] uppercase tracking-[0.4em] text-stone-400 mb-1">Wedding Management</p>
                <h1 class="font-serif text-3xl text-stone-green font-bold">Admin Dashboard</h1>
            </div>
            <div class="w-14 h-14 bg-stone-green rounded-full flex items-center justify-center card-shadow border border-stone-200 overflow-hidden">
                <img src="logo.png" alt="AG" class="w-10 h-10 object-cover" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <span class="text-stone-green text-xl font-bold hidden">AG</span>
            </div>
        </header>

        <!-- Quick Statistics -->
        <div class="grid grid-cols-2 gap-4 mb-8">
            <div class="bg-white p-5 rounded-[2rem] card-shadow border border-stone-100 text-center">
                <p class="text-[9px] font-bold uppercase tracking-widest text-stone-400 mb-1">Undangan Terkirim</p>
                <p id="totalTamu" class="text-2xl font-serif text-stone-green font-bold">--</p>
            </div>
            <div class="bg-white p-5 rounded-[2rem] card-shadow border border-stone-100 text-center">
                <p class="text-[9px] font-bold uppercase tracking-widest text-stone-400 mb-1">Ucapan Masuk</p>
                <p id="totalWish" class="text-2xl font-serif text-stone-green font-bold">--</p>
            </div>
        </div>

        <!-- Main Menu -->
        <h2 class="text-[10px] font-bold uppercase tracking-[0.3em] text-stone-400 mb-4 px-2">Main Menu</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <button onclick="openFullPage('generator.html')" class="group bg-stone-green p-6 rounded-[2rem] text-white flex items-center justify-between transition-all hover:brightness-110 active:scale-95 shadow-xl shadow-stone-green/20">
                <div class="text-left">
                    <p class="text-[9px] uppercase tracking-widest opacity-70 mb-1">Invitation</p>
                    <h3 class="font-serif text-xl">Link Generator</h3>
                </div>
                <div class="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center text-xl transition-transform group-hover:scale-110">✍️</div>
            </button>

            <button onclick="openFullPage('rekap-generator.html')" class="group bg-white p-6 rounded-[2rem] text-stone-green flex items-center justify-between card-shadow border border-stone-100 transition-all hover:bg-stone-50 active:scale-95">
                <div class="text-left">
                    <p class="text-[9px] uppercase tracking-widest text-stone-400 mb-1">Records</p>
                    <h3 class="font-serif text-xl">Sent Recap</h3>
                </div>
                <div class="w-12 h-12 bg-stone-green/10 rounded-full flex items-center justify-center text-xl transition-transform group-hover:-translate-y-1">📋</div>
            </button>
        </div>

        <div class="grid grid-cols-1 gap-4 mb-10">
            <button onclick="openFullPage('wish-gallery.html')" class="group bg-white p-6 rounded-[2rem] text-stone-green flex items-center justify-between card-shadow border border-stone-100 transition-all hover:bg-stone-50 active:scale-95">
                <div class="text-left">
                    <p class="text-[9px] uppercase tracking-widest text-stone-400 mb-1">Guest Sentiments</p>
                    <h3 class="font-serif text-xl">Wishes Gallery</h3>
                </div>
                <div class="w-12 h-12 bg-stone-green/10 rounded-full flex items-center justify-center text-xl transition-transform group-hover:scale-110">✨</div>
            </button>
        </div>

        <!-- External Link -->
        <h2 class="text-[10px] font-bold uppercase tracking-[0.3em] text-stone-400 mb-4 px-2">Live Web</h2>
        <div class="bg-white p-8 rounded-[2.5rem] card-shadow border border-stone-100 flex flex-col md:flex-row items-center gap-6">
            <div class="w-16 h-16 bg-stone-green/5 rounded-full flex items-center justify-center text-3xl">📱</div>
            <div class="text-center md:text-left flex-1">
                <h3 class="font-serif text-2xl text-stone-green mb-1 font-bold">Main Invitation</h3>
                <p class="text-xs text-stone-400 mb-4">Akses langsung ke halaman undangan pernikahan.</p>
                <a href="index.html" target="_blank" class="inline-block bg-stone-green text-white text-[10px] font-bold uppercase tracking-widest px-10 py-3 rounded-full shadow-lg">Open Invitation Page</a>
            </div>
        </div>

    </div>

    <!-- FULL PAGE OVERLAY -->
    <div id="fullOverlay" class="fixed inset-0 bg-stone-light z-[100] flex flex-col">
        <div class="bg-white px-5 py-4 relative flex items-center border-b border-stone-200 card-shadow z-10">
            <button onclick="closeFullPage()" class="relative z-20 text-stone-green text-[10px] font-bold flex items-center gap-2 uppercase tracking-widest active:scale-95">
                <span class="text-lg">←</span> BACK
            </button>
            <div class="absolute inset-x-0 text-center pointer-events-none">
                <span id="overlayTitle" class="text-[10px] font-bold uppercase tracking-widest text-stone-400">MENU</span>
            </div>
        </div>

        <div class="iframe-loader">
            <div class="spinner"></div>
            <p class="text-[10px] text-stone-400 uppercase tracking-widest mt-4">Loading Content...</p>
        </div>

        <iframe id="pageFrame" src="" class="w-full flex-grow border-none bg-transparent opacity-0 transition-opacity duration-300"></iframe>
    </div>

    <footer class="mt-16 mb-10 text-center text-stone-400 text-[10px] uppercase tracking-[0.4em] leading-loose">
       Aris & Ghefira Wedding<br>
       &copy; Powered by Sinar Ode Wedding Organizer
    </footer>

    <script>
        const overlay = document.getElementById('fullOverlay');
        const iframe = document.getElementById('pageFrame');
        const titleText = document.getElementById('overlayTitle');

        function openFullPage(url) {
            if (url.includes('generator') && !url.includes('rekap')) titleText.innerText = "Invitation Generator";
            else if (url.includes('rekap-generator')) titleText.innerText = "Sent Recap";
            else if (url.includes('wish-gallery')) titleText.innerText = "Wishes Gallery";
            else titleText.innerText = "System Menu";

            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';

            setTimeout(() => {
                iframe.style.opacity = '0';
                iframe.src = url;
            }, 100);
        }

        iframe.onload = function() {
            iframe.style.opacity = '1';
        };

        function closeFullPage() {
            overlay.classList.remove('active');
            iframe.style.opacity = '0';
            setTimeout(() => {
                iframe.src = "";
            }, 300);
            document.body.style.overflow = 'auto';
            updateQuickStats();
        }

        // Diambil langsung dari config.js supaya cukup diubah di 1 tempat
        const scriptURL = CONFIG.wishUrl;

        async function updateQuickStats() {
            try {
                const [resTamu, resWish] = await Promise.all([
                    fetch(`${scriptURL}?type=get_list&v=${Date.now()}`),
                    fetch(`${scriptURL}?type=get_wishes&v=${Date.now()}`)
                ]);

                const listTamu = await resTamu.json();
                const listWish = await resWish.json();

                document.getElementById('totalTamu').innerText = Array.isArray(listTamu) ? listTamu.length : 0;
                document.getElementById('totalWish').innerText = Array.isArray(listWish) ? listWish.length : 0;
            } catch (e) {
                console.error("Stats sync failed:", e);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.title = `Wedding Dashboard | ${CONFIG.text.namaPasangan}`;
            updateQuickStats();
        });
    </script>
</body>
</html>
